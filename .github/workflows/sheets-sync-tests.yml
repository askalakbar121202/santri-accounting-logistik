name: Sheets Sync Tests

on:
  push:
    branches:
      - fitur-sinkronisasi-google-sheets
    paths:
      - 'sheets-sync.js'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/sheets-sync-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'sheets-sync.js'
      - 'test/**'
      - 'package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run isolated sync tests
        run: npm test
